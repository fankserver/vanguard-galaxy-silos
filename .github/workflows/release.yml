name: Package release

# Triggers when a GitHub Release is published. Also runnable manually.
#
# The plugin references Assembly-CSharp.dll (the game's proprietary
# assembly) plus UnityEngine.UI.dll and Unity.TextMeshPro.dll (Unity
# runtime bits not covered by the UnityEngine.Modules NuGet). None can
# live on a public runner, so the repo commits PUBLICIZED stubs (method
# signatures only, no IL) at VGSilos/lib/. CI compiles against the stubs;
# the real runtime assemblies take over in-game via Mono's late binding.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout repo at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Fetch VGModAPI contract assembly
        # VGSilos compiles against the VGModAPI abstractions (SaveData
        # provider surface). Pin to the minimum supported API release — keep
        # in step with [BepInDependency(ModApi.PluginId, ...)] in Plugin.cs.
        # The publicized plugin zips carry VGModAPI.Abstractions.dll, which
        # is public contract only (no game IL), safe to compile against.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VGAPI_VERSION=0.2.8
          pinned=$(sed -n 's/.*\[BepInDependency(ModApi.PluginId, "\([0-9.]*\)").*/\1/p' VGSilos/Plugin.cs | head -1)
          if [ "$pinned" != "$VGAPI_VERSION" ]; then
            echo "::error::VGAPI_VERSION ($VGAPI_VERSION) drifts from [BepInDependency] pin ($pinned) in Plugin.cs."; exit 1
          fi
          gh release download "v${VGAPI_VERSION}" --repo fankserver/vanguard-galaxy-api \
            -p "VGModAPI-${VGAPI_VERSION}-stable.zip" -d /tmp/vgapi
          unzip -q "/tmp/vgapi/VGModAPI-${VGAPI_VERSION}-stable.zip" \
            'VGModAPI/VGModAPI.Abstractions.dll' -d /tmp/vgapi
          path="VGSilos/lib/VGModAPI.Abstractions.dll"
          if [ ! -s "/tmp/vgapi/VGModAPI/VGModAPI.Abstractions.dll" ]; then
            echo "::error::$path could not be extracted from the v${VGAPI_VERSION} release asset."; exit 1
          fi
          cp "/tmp/vgapi/VGModAPI/VGModAPI.Abstractions.dll" "$path"
          echo "Contract assembly: $path ($(du -h "$path" | cut -f1))"

      - name: Verify publicized references are committed
        run: |
          missing=0
          for stub in Assembly-CSharp.dll UnityEngine.UI.dll Unity.TextMeshPro.dll; do
            path="VGSilos/lib/$stub"
            if [ ! -s "$path" ]; then
              echo "::error::$path is missing or empty. Regenerate via 'assembly-publicizer --strip <game>/$stub -o $path' and commit. (--strip is required.)"
              missing=1
            else
              echo "Publicized reference present: $path ($(du -h "$path" | cut -f1))"
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: Build VGSilos.dll
        run: dotnet build VGSilos/VGSilos.csproj -c Debug --nologo

      - name: Stage release layout
        id: stage
        run: |
          VERSION=$(grep 'PluginVersion =' VGSilos/Plugin.cs | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PKG_NAME="VGSilos-v${VERSION}"
          # Nested VGSilos/ is intentional: it's the folder the user drops
          # into BepInEx/plugins/.
          PKG_DIR="dist/${PKG_NAME}/VGSilos"

          rm -rf "dist/${PKG_NAME}"
          mkdir -p "$PKG_DIR"

          cp VGSilos/bin/Debug/netstandard2.1/VGSilos.dll "$PKG_DIR/"
          # Standalone payload: game 0.8.1 ships no Newtonsoft.Json.dll, so
          # the plugin carries its own. Assert the exact build-output DLL
          # set here too — a missing Newtonsoft copy or a leaked
          # compile-only dep (BepInEx/Harmony/Unity) must fail packaging.
          BUILD_DIR="VGSilos/bin/Debug/netstandard2.1"
          actual=$(ls "$BUILD_DIR"/*.dll | xargs -r -n1 basename | sort | tr '\n' ',')
          expected="Newtonsoft.Json.dll,VGSilos.dll,"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: build output DLL set '$actual' != expected '$expected'"; exit 1
          fi
          cp "$BUILD_DIR/Newtonsoft.Json.dll" "$PKG_DIR/"
          # Same exact-set check on the staged archive contents.
          staged=$(ls "$PKG_DIR"/*.dll | xargs -n1 basename | sort | tr '\n' ',')
          if [ "$staged" != "$expected" ]; then
            echo "ERROR: staged DLL set '$staged' != expected '$expected'"; exit 1
          fi
          cp README.md "$PKG_DIR/"
          [ -f LICENSE ] && cp LICENSE "$PKG_DIR/" || true

          SIZE=$(du -sh "$PKG_DIR" | cut -f1)
          echo "Staged DLL + Newtonsoft.Json.dll + README — $SIZE at $PKG_DIR"

          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Zip release bundle
        run: |
          (cd "dist/${{ steps.stage.outputs.pkg_name }}" && \
             zip -qr "../${{ steps.stage.outputs.pkg_name }}.zip" VGSilos)
          ls -lh "dist/${{ steps.stage.outputs.pkg_name }}.zip"

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "dist/${{ steps.stage.outputs.pkg_name }}.zip" --clobber
          echo "Uploaded ${{ steps.stage.outputs.pkg_name }}.zip to release $TAG"
